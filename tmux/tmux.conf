# ~/.config/tmux/tmux.conf

unbind C-b
set -g prefix 'C-a'
bind 'C-a' send-prefix

# --- Terminal ---------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features "*:RGB"
set -g focus-events on
set -sg escape-time 10
set -g set-titles on
set -g set-titles-string "#S:#W"
set -g status-keys vi

# Popup terminal
bind Enter display-popup -d "#{pane_current_path}" -w 80% -h 80%

# --- Clipboard: OSC 52 everywhere --------------------------------------------
set -g set-clipboard on
set -g allow-passthrough on

# --- Extended keys ------------------------------------------------------------
set -s extended-keys on
set -g extended-keys-format csi-u
set -as terminal-features 'xterm*:extkeys'

# Start indices at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Intuitive split bindings that preserve cwd
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Switch sessions
bind ] switch-client -n
bind [ switch-client -p

# Reload config quickly
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# --- Copy mode (vi) -----------------------------------------------------------
# Copy:  prefix+v to enter copy mode, v to select, y to copy (→ system clipboard)
#        or just drag with the mouse — it copies on release.
# Paste: Ctrl+Shift+V (terminal paste) everywhere, or prefix+P for tmux's buffer.
setw -g mode-keys vi
bind v copy-mode
bind P paste-buffer -p
bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi C-v send -X rectangle-toggle
bind-key -T copy-mode-vi y send -X copy-selection-and-cancel
bind-key -T copy-mode-vi Escape send -X cancel

# Quality of life
set -g mouse on
set -g history-limit 50000
set -g detach-on-destroy off   # killing a session hops to the next one instead of detaching

# Smart pane switching with awareness of Neovim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind-key -n C-\\ if-shell "$is_vim" "send-keys C-\\\\" "select-pane -l"

# Configure the catppuccin plugin
set -g @catppuccin_flavor "macchiato"
set -g @catppuccin_window_status_style "rounded"

# Make the status line pretty and add some modules
set -g status-right-length 100
set -g status-left-length 100
set -g status-left " #{session_name} "
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# List of plugins
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
# Initialize TPM
run '~/.config/tmux/plugins/tpm/tpm'
