# ~/.config/kitty/kitty.conf
# Translated from ghostty/config when switching terminals — see that file's
# comments for the original rationale behind each setting.

# --- Theme: Catppuccin Macchiato ---------------------------------------------
# Kitty has no "theme = <name>" shorthand for a bundled catalog like Ghostty's,
# so the palette is inlined here (values copied from
# "ghostty/themes/Catppuccin Macchiato") instead of depending on `kitten
# themes` fetching it over the network at setup time.
background            #24273a
foreground             #cad3f5
selection_background   #5b6078
selection_foreground   #cad3f5
color0  #494d64
color1  #ed8796
color2  #a6da95
color3  #eed49f
color4  #8aadf4
color5  #f5bde6
color6  #8bd5ca
color7  #a5adcb
color8  #5b6078
color9  #ec7486
color10 #8ccf7f
color11 #e1c682
color12 #78a1f6
color13 #f2a9dd
color14 #63cbc0
color15 #b8c0e0

font_family Cousine

# cursor-invert-fg-bg equivalent: cursor filled with foreground color, text
# under it drawn in the background color.
cursor            #f4dbd6
cursor_text_color background
cursor_shape beam
# No cursor_opacity option exists in kitty (unlike Ghostty's cursor-opacity);
# this is the closest available equivalent.

background_opacity 0.96

hide_window_decorations yes
window_padding_width 2

# --- Shift+Enter newline in Claude Code --------------------------------------
# Same fix as Ghostty's `keybind = shift+enter=text:\x1b\r`: send ESC+CR,
# which Claude Code and other CLI apps read as "insert newline". Works both
# inside and outside tmux; tmux's `extended-keys on` + terminal-features
# override (tmux.conf) passes it through for kitty-protocol-aware apps too.
map shift+enter send_text all \x1b\r

# --- Clipboard: OSC 52 everywhere --------------------------------------------
# Kitty writes to the system clipboard on OSC 52 by default
# (clipboard_control's default already includes write-clipboard and
# write-primary without prompting) — no override needed to fit the
# tmux/Neovim OSC 52 pipeline documented in the top-level CLAUDE.md. Reads
# (e.g. a program asking the terminal for clipboard contents) still require
# confirmation by default, which is fine since nothing in this setup does
# that; paste comes from the terminal via Ctrl+Shift+V as before.
